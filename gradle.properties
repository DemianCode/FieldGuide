# Base marketing version, single source of truth: app/build.gradle.kts appends the CI build
# number to it, and the release workflow reads it from here to name the tag. Bump it by hand
# for a real version change; CI supplies the trailing build number.
appVersionName=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
