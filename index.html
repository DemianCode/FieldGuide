<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Modern visual flashcard, active recall, and multiple-choice quiz trainer for birds, flowers, aircraft, and AI-built JSON decks."
    />
    <title>FieldGuide — Focused Visual Study &amp; Quiz Trainer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <script>
      // Apply the saved appearance before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('fieldguide_theme_v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px;color:var(--text-muted);font-family:system-ui,sans-serif;">
        <img src="./icons/icon.svg" alt="" style="width:44px;height:44px;border-radius:12px;opacity:0.9;" />
        <span style="font-size:0.9rem;font-weight:600;letter-spacing:0.02em;">Loading FieldGuide…</span>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
